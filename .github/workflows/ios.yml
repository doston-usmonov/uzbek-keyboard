# iOS ilovasini Mac'siz tekshirish: imzosiz yig'adi va .ipa'ni artefakt sifatida saqlaydi.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen
        run: brew install xcodegen

      - name: Xcode loyihasini yaratish
        working-directory: ios
        run: xcodegen generate

      - name: Yig'ish (imzosiz)
        working-directory: ios
        run: |
          xcodebuild -project UzYangi.xcodeproj -target UzYangi \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      - name: .ipa yaratish
        working-directory: ios/build/Release-iphoneos
        run: |
          test -d UzYangi.app/PlugIns/UzYangiKeyboard.appex
          test -f UzYangi.app/PlugIns/UzYangiKeyboard.appex/layout.json
          mkdir Payload
          cp -R UzYangi.app Payload/
          zip -qr uz_yangi_unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: uz_yangi_unsigned_ipa
          path: ios/build/Release-iphoneos/uz_yangi_unsigned.ipa
